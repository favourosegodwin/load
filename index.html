
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Supabase App</title>
</head>
<body>
  <h1>My First Supabase App</h1>
  
<form id="signup-form">
  <h2>Create an account</h2>

  <label for="full-name">Full name</label>
  <input
    type="text"
    id="full-name"
    placeholder="Enter your full name"
    required
  >

  <br><br>

  <label for="email">Email address</label>
  <input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
  >

  <br><br>

  <label for="password">Password</label>
  <input
    type="password"
    id="password"
    placeholder="Create a password"
    required
    minlength="6"
  >

  <br><br>

  <button type="submit">Register</button>
</form>

<hr>

<form id="login-form">
  <h2>Log in</h2>

  <label for="login-email">Email address</label>
  <input
    type="email"
    id="login-email"
    placeholder="Enter your email"
    required
  >

  <br><br>

  <label for="login-password">Password</label>
  <input
    type="password"
    id="login-password"
    placeholder="Enter your password"
    required
  >

  <br><br>

  <button type="submit">Log in</button>
</form>


<p id="status"></p>
<button id="logout-button" type="button">
  Log out
</button>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabaseUrl = 'https://xsruaqjcfclkmxqkqfvy.supabase.co';
    const supabaseKey = 'sb_publishable_Pp7EHQ0OW10IbR9QQG1_Fg_q3vGcWCy';

    const supabase = createClient(supabaseUrl, supabaseKey);

    

const form = document.getElementById('signup-form');
const status = document.getElementById('status');

form.addEventListener('submit', async (event) => {
  // Stop the browser from refreshing the page
  event.preventDefault();

  // Get what the user typed
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  status.textContent = 'Creating your account...';

  // Ask Supabase to register the user
  const fullName = document.getElementById('full-name').value;


const { data, error } = await supabase.auth.signUp({
  email: email,
  password: password,
  options: {
    data: {
      full_name: fullName
    },
    emailRedirectTo: 'https://favourosegodwin.github.io/load/'
  }
});


  // If something went wrong, show the error
  if (error) {
    status.textContent = 'Error: ' + error.message;
    return;
  }

  // If registration worked, show a message
  status.textContent = data.session
    ? 'Account created! You are now logged in.'
    : 'Registration submitted! Check your email to confirm your account.';
});

const loginForm = document.getElementById('login-form');

loginForm.addEventListener('submit', async (event) => {
  // Stop the browser from refreshing the page
  event.preventDefault();

  // Get the email and password entered by the user
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;

  status.textContent = 'Logging in...';

  // Ask Supabase to log in the user
  const { data, error } = await supabase.auth.signInWithPassword({
    email: email,
    password: password
  });

  // If login fails, display the error
  if (error) {
    status.textContent = 'Login failed: ' + error.message;
    return;
  }

  // If login succeeds
const fullName = data.user.user_metadata.full_name;

const { error: profileError } = await supabase
  .from('profiles')
  .upsert(
    {
      id: data.user.id,
      full_name: fullName
    },
    { onConflict: 'id' }
  );

if (profileError) {
  status.textContent =
    'Logged in, but profile save failed: ' + profileError.message;
  return;
}


status.textContent = 'Welcome, ' + (fullName || data.user.email) +
  '! You are logged in.';
});

async function checkLoginStatus() {
  const { data, error } = await supabase.auth.getSession();

  if (error) {
    status.textContent = 'Could not check login status.';
    return;
  }

  if (data.session) {
    status.textContent =
      'You are logged in as ' + data.session.user.email;
  } else {
    status.textContent = 'You are not logged in.';
  }
}

checkLoginStatus();


const logoutButton = document.getElementById('logout-button');

logoutButton.addEventListener('click', async () => {
  status.textContent = 'Logging out...';

  const { error } = await supabase.auth.signOut();

  if (error) {
    status.textContent = 'Logout failed: ' + error.message;
    return;
  }

  status.textContent = 'You have logged out successfully.';
});

  </script>
</body>
</html>
